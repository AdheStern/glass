# Glass — desarrollo. Uso: docker compose -f compose.yml -f compose.dev.yml up
# (envuelto por el Makefile: `make up`).

services:
  app:
    build:
      target: dev
    command: pnpm dev
    volumes:
      - .:/app
      # Volúmenes nombrados: node_modules y .next NO se montan desde el host
      # (choque de binarios nativos + HMR que se arrastra — §22 tabla 22.3).
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # Correo de Supabase Auth / verificación va a Mailpit en dev
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      mailpit:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # bandeja web
      - "1025:1025" # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    restart: unless-stopped
